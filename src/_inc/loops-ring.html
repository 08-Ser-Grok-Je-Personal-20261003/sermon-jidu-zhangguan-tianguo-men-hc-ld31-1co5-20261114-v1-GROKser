<p class="spine-note" data-note="0">出埃及先有羔羊，后有除酵。林前5把次序保留下来：基督是逾越节的羊，所以教会才清除旧酵。</p>
<p class="spine-note" data-note="1">约里的百姓有内外之分。新约教会继承圣洁的呼召，却不继承用官府的刀执行除名。</p>
<p class="spine-note" data-note="2">钥匙在认信基督时交托，在纪律的段落里交给教会，在复活的主差遣门徒时连于赦罪的宣告。林前5是使用，林后2是目的：挽回。</p>
<p class="spine-note" data-note="3">罪是夸口与容忍。恩典是羔羊已经死了。感恩是用诚实守节，并在悔改时把人接回。</p>
