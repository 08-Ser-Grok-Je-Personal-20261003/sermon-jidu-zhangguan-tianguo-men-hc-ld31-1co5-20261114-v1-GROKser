<div class="svg-wrap rv"><svg viewBox="0 0 400 520" role="img" aria-labelledby="fs-t fs-d" width="400" height="520">
<title id="fs-t">纪律步骤</title>
<desc id="fs-d">按主日31的次序画出的流程图。受害与刑案要先保护、先依法，不把私下对质当成第一步。</desc>
<rect width="400" height="520" rx="14" class="box-s"/>
<text x="200" y="28" text-anchor="middle" font-size="15" font-weight="700">步骤 · 先问是不是安全</text>
<rect x="40" y="46" width="320" height="48" rx="10" class="box-b"/>
<text x="200" y="66" text-anchor="middle" font-size="13" font-weight="700">若有暴力、性侵害或儿童</text>
<text x="200" y="84" text-anchor="middle" font-size="12">先保护，先按法律报告</text>
<rect x="40" y="110" width="320" height="44" rx="10" class="box-w"/>
<text x="200" y="138" text-anchor="middle" font-size="13" font-weight="700">普通的肢体之过：私下反复劝</text>
<path d="M200 154 V176" class="ln-g"/>
<rect x="40" y="176" width="320" height="44" rx="10" class="box-w"/>
<text x="200" y="204" text-anchor="middle" font-size="13" font-weight="700">不听，就带到教会 / 长老</text>
<path d="M200 220 V242" class="ln-g"/>
<rect x="40" y="242" width="320" height="44" rx="10" class="box-g"/>
<text x="200" y="270" text-anchor="middle" font-size="13" font-weight="700">仍不听：停止领圣餐</text>
<path d="M200 286 V308" class="ln-b"/>
<rect x="40" y="308" width="320" height="44" rx="10" class="box-b"/>
<text x="200" y="336" text-anchor="middle" font-size="13" font-weight="700">再顽梗：排除于教会之外</text>
<path d="M200 352 V374" class="ln-n"/>
<rect x="40" y="374" width="320" height="52" rx="10" class="box-n"/>
<text x="200" y="396" text-anchor="middle" font-size="13" font-weight="700">承诺并显出悔改</text>
<text x="200" y="414" text-anchor="middle" font-size="12">重新接纳为肢体</text>
<text x="200" y="454" text-anchor="middle" font-size="12" class="t-mut">恢复会籍不等于取消民事后果</text>
<text x="200" y="476" text-anchor="middle" font-size="12" class="t-mut">也不等于强迫受害者恢复接触</text>
<text x="200" y="504" text-anchor="middle" font-size="12" class="t-mut">本地章程不能改掉基督的命令</text>
</svg></div>
