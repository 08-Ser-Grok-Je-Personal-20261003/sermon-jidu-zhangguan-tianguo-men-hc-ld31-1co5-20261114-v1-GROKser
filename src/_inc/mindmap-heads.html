<rect x="36" y="16" width="328" height="58" rx="14" class="box-g"/>

<rect x="24" y="92" width="352" height="52" rx="12" class="box-n"/>
<text x="200" y="114" text-anchor="middle" font-size="15" font-weight="700">1 福音打开门</text>
<text x="200" y="134" text-anchor="middle" font-size="12">问84 · 宣讲与公开见证</text>
